# Alacritty Configuration
# File location: ~/.config/alacritty/alacritty.yml

window:
  opacity: 0.9
  padding:
    x: 5
    y: 5
  decorations: full
  startup_mode: Windowed
  dimensions:
    columns: 120
    lines: 30

scrolling:
  history: 2000
  multiplier: 5

font:
  normal:
    family: "CaskaydiaCove Nerd Font Mono"
    style: Regular
  size: 10.0

colors:
  primary:
    background: '#1a1b26'
    foreground: '#a9b1d6'
  cursor:
    text: '#1a1b26'
    cursor: '#c0caf5'
  selection:
    text: 'CellForeground'
    background: '#48B9C7'

  normal:
    black:   '#414868'
    red:     '#F7768E'
    green:   '#9ECE6A'
    yellow:  '#e0af68'
    blue:    '#7aa2f7'
    magenta: '#bb9af7'
    cyan:    '#7dcfff'
    white:   '#A9B1D6'

  bright:
    black:   '#414868'
    red:     '#F7768E'
    green:   '#9ECE6A'
    yellow:  '#e0af68'
    blue:    '#7aa2f7'
    magenta: '#bb9af7'
    cyan:    '#7dcfff'
    white:   '#c0caf5'

cursor:
  style:
    shape: Block
    blinking: Off

mouse:
  hide_when_typing: true

selection:
  save_to_clipboard: true

key_bindings:
  - { key: V, mods: Control|Shift, action: Paste }
  - { key: C, mods: Control|Shift, action: Copy }
  - { key: Insert, mods: Shift, action: PasteSelection }
  - { key: PageUp, mods: Control|Shift, action: ScrollPageUp }
  - { key: PageDown, mods: Control|Shift, action: ScrollPageDown }
  - { key: Home, mods: Control|Shift, action: ScrollToTop }
  - { key: End, mods: Control|Shift, action: ScrollToBottom }
  - { key: Equals, mods: Control, action: IncreaseFontSize }
  - { key: Minus, mods: Control, action: DecreaseFontSize }
  - { key: Key0, mods: Control, action: ResetFontSize }

