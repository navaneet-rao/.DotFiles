[cursor.style]
blinking = "On"
shape = "Block"

[env]
TERM = "xterm-256color"

[font]
size = 12.0

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Regular"

[general]
import = ["~/.config/alacritty/catppuccin-mocha.toml"]

[mouse]
hide_when_typing = true

[scrolling]
history = 100000
multiplier = 5

[selection]
save_to_clipboard = true
