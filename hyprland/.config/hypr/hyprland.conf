exec-once = waybar & swaync & hypridle
exec-once = swww init 
exec-once = waypaper-engine run
exec-once = wl-paste --watch cliphist store
exec-once = xhost +SI:localuser:root
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 2>&1 | xargs -I {} notify-send "Polkit Agent" "{}"
exec = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"   # for GTK3 apps
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps

