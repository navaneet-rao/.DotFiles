unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s
set -g mouse on 

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.Dotfiles/personal/todo.md"

# Moving Panes Between Sessions
## Detach a pane and move it to another session:
bind-key m command-prompt -p "Move pane to session:" "join-pane -s '%%'"
## Break a pane into a new window (detach from the current layout):
bind-key b break-pane -d
## Move a pane to a different session and attach:
bind-key M command-prompt -p "Move pane to session:" "join-pane -s '%%' \; select-pane -t '%%'"
## This moves the current pane to another session
bind-key . command-prompt -p "Move to session:" "move-pane -t '%%'"

# set-window-option -g window-active-style bg=terminal
# set-window-option -g window-style        bg=black

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r i run-shell "tmux neww tmux-cht.sh"

