# True color support (Kitty specific, with fallback check)
if-shell '[ "$TERM" = "xterm-kitty" ]' "set-option -sa terminal-overrides ',xterm-kitty:Tc'"

# Enable clipboard integration
set -g set-clipboard on
set-option -g @yank_selection "clipboard"

##### User Experience #####

# Mouse support
set -g mouse on

# Start windows and panes at index 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Disable annoying bells
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g monitor-activity off
set -g bell-action none

##### Prefix & Key Bindings #####

# Change prefix from Ctrl-b to Ctrl-s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# Pane navigation (Vim-style)
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# Pane navigation without prefix (Alt + Arrows)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Window switching (Shift + Arrows and Alt + H/L)
bind -n S-Left previous-window
bind -n S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# Pane splitting with working directory preserved
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# Join pane by prompting for source
bind j command-prompt -p "Join pane from window:" "join-pane -s '%%'"

##### Copy Mode (Vi style) #####

set-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

##### Plugin Manager: TPM #####

# Initialize TPM and plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Catppuccin Theme - Mocha
set -g @catppuccin_flavour 'mocha'

# Load TPM plugins
run '~/.tmux/plugins/tpm/tpm'

