# Enable true color support (important for Kitty)
set-option -sa terminal-overrides ",xterm-kitty:Tc"

# Use Kitty's clipboard for copy-paste
set -g set-clipboard on

# Enable mouse support for resizing, scrolling, and selecting
set -g mouse on

# Change the tmux prefix from C-b to C-s for easier access
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Use Vim-style pane navigation (Ctrl + H/J/K/L)
bind -r C-h select-pane -L
bind -r C-j select-pane -D 
bind -r C-k select-pane -U
bind -r C-l select-pane -R

# Use Alt + Arrow keys to switch panes without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Use Shift + Arrow keys to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Use Alt + H/L to switch windows (like Vim's tab navigation)
bind -n M-H previous-window
bind -n M-L next-window

# Start window and pane indexes at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split panes while maintaining the current working directory
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# Disable bell notifications
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Enable Vi mode for copy-paste
set-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Use Kitty's native clipboard support (for seamless copy-paste)
set-option -g @yank_selection "clipboard"

# Plugin management using TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Apply Catppuccin theme (Mocha flavor)
set -g @catppuccin_flavour 'mocha'

# Initialize TPM plugins
run '~/.tmux/plugins/tpm/tpm'

